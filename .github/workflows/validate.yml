name: Validate

on:
  pull_request:
    branches: [main, dev]
  workflow_call:        # run by deploy.yml before every deploy
  workflow_dispatch:

permissions:
  contents: read

env:
  HUGO_VERSION: 0.158.0
  # sha256 of hugo_extended_${HUGO_VERSION}_linux-amd64.deb from the release's checksums.txt
  HUGO_SHA256: b63b49c2961f6f9f761368f790c34f26b62c4b17dc915f014db6885f7cd5681f

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0   # enableGitInfo needs history for lastmod

      - name: Install Hugo (checksum-verified)
        run: |
          deb="hugo_extended_${HUGO_VERSION}_linux-amd64.deb"
          wget -q "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/${deb}"
          echo "${HUGO_SHA256}  ${deb}" | sha256sum -c -
          sudo dpkg -i "${deb}"

      - name: Build site (warnings are errors)
        run: hugo --minify --panicOnWarning

      - name: Site checks (front matter, downloads, orphans, internal links, SEO, size)
        run: python3 .github/scripts/check_site.py
